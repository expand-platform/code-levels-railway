{% load difficulty_tags %}

<div
  class="project-card{% if project.type == 'workout' %} project-card--workout{% endif %}{% if project.difficulty %} project-card--difficulty-{{ project.difficulty|difficulty_level }}{% endif %}"
  data-id="{{ project.id }}"
>
  <div class="project-inner w-100{% if project.slug or project.link %} h-100 d-flex flex-column{% endif %}">
    {% if project.image %}
      {% if project.slug or project.link %}
        <a href="{% if project.slug %}{% url 'project_details' slug=project.slug %}{% else %}{{ project.link }}{% endif %}"{% if project.link and not project.slug %} target="_blank" rel="noopener noreferrer"{% endif %}>
          <img src="{{ project.image.url }}" alt="{{ project.title }}" class="project-image" />
        </a>
      {% else %}
        <img src="{{ project.image.url }}" alt="{{ project.title }}" class="project-image" />
      {% endif %}
    {% endif %}

    <div class="project-info{% if project.slug or project.link %} flex-grow-1 d-flex flex-column justify-content-between{% endif %}">
      {% if project.slug or project.link %}
        <h3 class="mb-4">
          <a href="{% if project.slug %}{% url 'project_details' slug=project.slug %}{% else %}{{ project.link }}{% endif %}"{% if project.link and not project.slug %} target="_blank" rel="noopener noreferrer"{% endif %} style="color: var(--blue);">{{ project.title }}</a>
        </h3>
      {% else %}
        <h3 class="mb-3"><span style="color: var(--text-grey);">{{ project.title }}</span></h3>
      {% endif %}
    </div>
  </div>
</div>
