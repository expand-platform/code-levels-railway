{% load i18n %}
<button
  type="button"
  class="project-search-trigger"
  data-project-search-open
  aria-label="{% trans 'Search projects' %}"
  aria-haspopup="dialog"
  aria-controls="project-search-modal"
>
  <i class="{% if show_label %}bx {% endif %}bi bi-search" aria-hidden="true"></i>
  {% if show_label %}
    <span class="text">{% trans 'Search' %}</span>
  {% endif %}
</button>
