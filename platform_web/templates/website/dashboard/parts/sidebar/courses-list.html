<div id="{{ collapse_id }}" class="collapse submenu-collapse">
  <ul class="submenu">
    <li>
      <a href="{% url all_url_name %}" data-route="{{ route }}">
        <i class="bi bi-journal-code text-black"></i>
        <span class="text-black clipped-text">{{ all_label }}</span>
      </a>
    </li>

    {% for course in courses %}
      <li>
        <a href="{% url course_url_name course.slug %}" data-route="{{ route }}">
          <i class="bi bi-journal-code text-black"></i>
          <span class="text-black clipped-text">{{ course.title }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
</div>
