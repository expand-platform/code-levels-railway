{% load difficulty_tags %}

<div
  class="project-card{% if project.type == 'workout' %} project-card--workout{% endif %}{% if project.difficulty %} project-card--difficulty-{{ project.difficulty|difficulty_level }}{% endif %}"
  data-id="{{ project.id }}"
>
  <div class="project-inner w-100{% if project.slug %} h-100 d-flex flex-column{% endif %}">
    {% include 'website/dashboard/parts/project-card-meta.html' %}

    {% if project.image %}
      {% if project.slug %}
        <a href="{% url 'project_details' slug=project.slug %}">
          <img src="{{ project.image.url }}" alt="{{ project.title }}" class="project-image" />
        </a>
      {% else %}
        <img src="{{ project.image.url }}" alt="{{ project.title }}" class="project-image" />
      {% endif %}
    {% endif %}

    <div class="project-info{% if project.slug %} flex-grow-1 d-flex flex-column justify-content-between{% endif %}">
      {% if project.slug %}
        <h3 class="mb-4">
          <a href="{% url 'project_details' slug=project.slug %}" style="color: var(--blue);">{{ project.title }}</a>
        </h3>
      {% else %}
        <h3 class="mb-3"><span style="color: var(--text-grey);">{{ project.title }}</span></h3>
      {% endif %}
    </div>
  </div>
</div>
